<VirtualHost *:80>
    DocumentRoot /var/www/html
    # Cabecera heredada de la versión anterior del portal (nadie la quitó)
    Header always set X-Powered-By "PHP/7.4.3"
</VirtualHost>

<VirtualHost *:443>
    DocumentRoot /var/www/html
    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/qhapaq.crt
    SSLCertificateKeyFile /etc/ssl/private/qhapaq.key
    Header always set X-Powered-By "PHP/7.4.3"
</VirtualHost>
