[global]
   workgroup = QHAPAQ
   server string = Qhapaq File Server
   server role = standalone server
   # ERROR DE CONFIGURACIÓN (intencional): usuarios inexistentes entran como invitado
   map to guest = Bad User
   guest account = nobody
   disable netbios = yes
   smb ports = 445
   log level = 1

[publico]
   comment = Documentos para todo el personal
   path = /srv/publico
   guest ok = yes
   read only = yes
   browseable = yes

[rrhh]
   comment = Recursos Humanos - Planillas
   path = /srv/rrhh
   valid users = rrhh
   read only = yes
   browseable = yes
