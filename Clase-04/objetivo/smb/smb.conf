[global]
   workgroup = QHAPAQ
   server string = Servidor de archivos Qhapaq
   netbios name = QI-FILES
   server role = standalone server
   security = user
   map to guest = Bad User
   smb ports = 445
   log level = 1
   disable netbios = yes
   load printers = no
   printing = bsd
   printcap name = /dev/null

[publico]
   path = /srv/publico
   guest ok = yes
   read only = yes

[ti]
   comment = Area de TI - solo personal autorizado
   path = /srv/ti
   valid users = mquispe jdiaz
   read only = yes
