# Clase 05 · Ataques a aplicaciones Web y APIs · Inversiones Qhapaq SAC
# Levantar portal propio:   docker compose up -d --build
# Añadir OWASP Juice Shop:   docker compose --profile juice up -d
# Apagar:                    docker compose --profile juice down
name: qhapaq-web

networks:
  qhapaq-web:
    driver: bridge
    ipam:
      config:
        - subnet: 10.50.0.0/24

services:
  portal:
    build: ./portal
    container_name: qw-portal
    hostname: qw-portal
    networks: { qhapaq-web: { ipv4_address: 10.50.0.10 } }
    ports: ["5000:5000"]        # accesible también en http://localhost:5000
    restart: unless-stopped

  # Alternativa/《complemento》profesional: OWASP Juice Shop (la app vulnerable de referencia)
  juice:
    image: bkimminich/juice-shop
    profiles: [juice]
    container_name: qw-juice
    hostname: qw-juice
    networks: { qhapaq-web: { ipv4_address: 10.50.0.20 } }
    ports: ["3000:3000"]        # http://localhost:3000
    restart: unless-stopped
