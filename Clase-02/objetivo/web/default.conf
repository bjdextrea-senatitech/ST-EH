server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Carpeta "olvidada" de un despliegue anterior: listado de directorio activo
    location /dev-old/ {
        autoindex on;
    }
}
